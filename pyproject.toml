[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwatch"
version = "0.1.0"
description = "Statistical drift monitoring for ML model prediction logs, from S3 to CloudWatch."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
dependencies = [
    "boto3==1.43.78",
    "pandas==2.3.3",
    "evidently==0.7.21",
    "scipy==1.18",
    ]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "mypy==1.14.1",
    "ruff==0.9.2",
]

[project.scripts]
driftwatch = "driftwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "evidently.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
